# 是否启用插件。
is_enabled: true
# SCP-294 position, projected onto the floor below when spawned.
machine_position:
  x: 58
  y: 292
  z: -43
# SCP-294 rotation; the front faces local negative Z.
machine_rotation:
  x: 0
  y: 0
  z: 0
# Model size: 10 gives the authored 2.2-metre cabinet; other values scale proportionally.
machine_scale: 10
# 玩家与饮料机交互的个人冷却秒数。
personal_cooldown: 2
# 是否在每轮开始时自动生成饮料机。
spawn_on_round_start: false
# 回合开始后自动生成 SCP-294? 的延迟秒数。
spawn_delay: 60
# 饮料机出现时的顶部公告秒数。
spawn_broadcast_duration: 8
# 巧乐兹成功时的移速效果持续时间。
qiao_le_zi_duration: 120
# 巧乐兹负面分支的心脏骤停持续秒数。
qiao_le_zi_cardiac_duration: 6
# Drop percentages: 0 disables a drink; up to two decimal places; total must be 100.
# Invalid odds log a warning and use the default odds below until the next load.
scp207_chance_percent: 78
ahead_chance_percent: 10
qiao_le_zi_chance_percent: 2.4
sixty_seven_chance_percent: 3.6
vodka_chance_percent: 3.6
compound_v_chance_percent: 1.2
meteor_chance_percent: 0.96
jiahao_chance_percent: 0.24
# Conditional branch probabilities, 0-100 percent.
qiao_le_zi_cardiac_chance_percent: 50
jiahao_success_chance_percent: 10
# Bonus movement speed: native MovementBoost intensity, 0-255 percent.
qiao_le_zi_speed_boost_percent: 100
ahead_speed_boost_percent: 20
compound_v_speed_boost_percent: 255
meteor_speed_boost_percent: 150
# Firearm damage bonus, clamped to 0-1000 percent.
ahead_firearm_damage_bonus_percent: 5
# Slowness, clamped to 0-100 percent.
ahead_backlash_slowness_percent: 20
# Original maximum HP retained during backlash, clamped to 1-100 percent.
ahead_backlash_max_health_percent: 80
vodka_slowness_percent: 10
# Actual damage reduction, clamped to 0-100 and rounded to native 0.5% steps.
vodka_damage_reduction_percent: 7.5
# 67 饮料的效果持续时间。
sixty_seven_duration: 67
# 遥遥领先主效果持续时间。
ahead_duration: 90
# Ahead's temporary backlash duration, in seconds.
ahead_backlash_duration: 30
# 伏特加效果持续时间。
vodka_duration: 120
# 5号化合物的移速255效果持续秒数。
compound_v_duration: 10
# 5号化合物的反噬持续秒数。
compound_v_backlash_duration: 30
# 5号化合物反噬的缓慢强度，百分比。
compound_v_backlash_slowness: 50
# 美味流星飞行至自爆的秒数。
meteor_duration: 20
# 美味流星连续静止超过此秒数即自爆。
meteor_still_seconds: 1
# 嘉豪附体效果持续秒数。
jiahao_duration: 90
# 嘉豪 OGG BGM 路径。优先使用 DLL 旁的 jh.ogg，缺失时使用内嵌音乐；也可填自定义 OGG 绝对路径。
jiahao_music_path: jh.ogg
# 嘉豪 BGM 的最大听觉半径，米。
jiahao_music_radius: 10
# 嘉豪 BGM 音量。
jiahao_music_volume: 1
# 领取、使用和结束文案显示秒数，到期自动移除。
hint_message_duration: 6
# 饮料倒计时纵坐标，0为顶部、1080为底部。
buff_hint_y: 760
# 饮料倒计时相对右边缘的水平偏移，负数向左移。
buff_hint_x: -260
# 手持饮料介绍起始纵坐标，向下排列名称和梗文案。
item_hint_y: 790
# 临时文案纵坐标，与介绍和倒计时分开。
message_hint_y: 560
